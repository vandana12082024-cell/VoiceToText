workflows:
  android-test:
    name: Android test APK
    working_directory: .
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: stable
      java: 17
      groups:
        - mobile_config
    scripts:
      - name: Check repository files
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          for required in mobile/pubspec.yaml mobile/lib/main.dart; do
            if [ ! -f "$required" ]; then
              echo "Missing required repository file: $required"
              echo "Upload the mobile/ folder beside codemagic.yaml in the GitHub branch being built."
              exit 1
            fi
          done
      - name: Create embedded Android setup tools
        script: |
          set -eu
          mkdir -p "$CM_BUILD_DIR/.ci-android"
          cat > "$CM_BUILD_DIR/.ci-android/prepare_android.py" <<'PY_HELPER'
          """Generate native Android files on the cloud builder without replacing Dart code."""
          
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          from urllib.parse import urlsplit
          import xml.etree.ElementTree as ET
          
          ROOT = Path(__file__).resolve().parents[1]
          ANDROID_NS = "http://schemas.android.com/apk/res/android"
          
          
          def check_config(environ):
              for name in ("API_BASE_URL", "SUPABASE_URL", "SUPABASE_PUBLISHABLE_KEY"):
                  if not environ.get(name, "").strip():
                      raise ValueError(f"Add {name} to Codemagic's mobile_config variable group.")
              for name in ("API_BASE_URL", "SUPABASE_URL"):
                  url = urlsplit(environ[name])
                  if url.scheme != "https" or not url.hostname or url.username or url.query or url.fragment:
                      raise ValueError(f"{name} must be an HTTPS service URL without credentials or query parameters.")
                  if url.path.rstrip("/"):
                      raise ValueError(f"{name} must be the service origin, without /api/v1 or another path.")
              key = environ["SUPABASE_PUBLISHABLE_KEY"]
              if key.startswith(("sb_secret_", "gsk_")):
                  raise ValueError("Use a Supabase public key for the app, never a server secret.")
          
          
          def configure_android(mobile):
              manifest = mobile / "android/app/src/main/AndroidManifest.xml"
              ET.register_namespace("android", ANDROID_NS)
              tree = ET.parse(manifest)
              root = tree.getroot()
              name_attribute = f"{{{ANDROID_NS}}}name"
              existing = {node.get(name_attribute) for node in root.findall("uses-permission")}
              for permission in ("android.permission.INTERNET", "android.permission.RECORD_AUDIO"):
                  if permission not in existing:
                      root.insert(0, ET.Element("uses-permission", {name_attribute: permission}))
              application = root.find("application")
              if application is None:
                  raise ValueError("Android manifest has no application element.")
              application.set(f"{{{ANDROID_NS}}}label", "Voice to Text")
              tree.write(manifest, encoding="utf-8", xml_declaration=True)
          
              gradle = mobile / "android/app/build.gradle.kts"
              if not gradle.is_file():
                  raise ValueError("Expected the Kotlin Gradle file generated by the current Flutter SDK.")
              text = gradle.read_text(encoding="utf-8")
              text = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = maxOf(23, flutter.minSdkVersion)", text)
              text = re.sub(r"minSdk\s*=\s*(\d+)", lambda match: f"minSdk = {max(23, int(match.group(1)))}", text)
              gradle.write_text(text, encoding="utf-8")
          
          
          def main():
              if "--check-config" in sys.argv:
                  check_config(os.environ)
                  print("Public app configuration is present.")
                  return
              mobile = ROOT / "mobile"
              android = mobile / "android"
              if not (android / "gradlew").is_file():
                  if android.exists():
                      raise ValueError("An incomplete Android directory exists; complete it before building.")
                  with tempfile.TemporaryDirectory(prefix="voice-android-") as directory:
                      scaffold = Path(directory) / "scaffold"
                      subprocess.run([
                          "flutter", "create", "--platforms=android", "--project-name=voice_to_text",
                          "--org=in.startechindia", "--no-pub", str(scaffold),
                      ], check=True)
                      shutil.copytree(scaffold / "android", android)
              configure_android(mobile)
              print("Android microphone and internet permissions are configured.")
          
          
          if __name__ == "__main__":
              try:
                  main()
              except ValueError as error:
                  raise SystemExit(str(error)) from error
          PY_HELPER
          cat > "$CM_BUILD_DIR/.ci-android/test_prepare_android.py" <<'PY_TESTS'
          import tempfile
          from pathlib import Path
          import unittest
          import xml.etree.ElementTree as ET
          
          from prepare_android import ANDROID_NS, check_config, configure_android
          
          
          class AndroidPreparationTests(unittest.TestCase):
              def test_configuration_requires_all_three_values(self):
                  with self.assertRaisesRegex(ValueError, "API_BASE_URL"):
                      check_config({})
          
              def test_configuration_rejects_local_http_and_server_keys(self):
                  config = {
                      "API_BASE_URL": "https://api.example.com",
                      "SUPABASE_URL": "https://example.supabase.co",
                      "SUPABASE_PUBLISHABLE_KEY": "sb_publishable_example",
                  }
                  check_config(config)
                  with self.assertRaises(ValueError):
                      check_config({**config, "API_BASE_URL": "http://localhost:8000"})
                  with self.assertRaises(ValueError):
                      check_config({**config, "SUPABASE_PUBLISHABLE_KEY": "sb_secret_example"})
                  with self.assertRaises(ValueError):
                      check_config({**config, "API_BASE_URL": "https://api.example.com/api/v1"})
          
              def test_permissions_are_idempotent_and_existing_activity_is_preserved(self):
                  with tempfile.TemporaryDirectory(prefix="voice-android-test-") as directory:
                      mobile = Path(directory)
                      manifest = mobile / "android/app/src/main/AndroidManifest.xml"
                      manifest.parent.mkdir(parents=True)
                      manifest.write_text(
                          f'<manifest xmlns:android="{ANDROID_NS}"><application android:label="old">'
                          '<activity android:name=".MainActivity" /></application></manifest>',
                          encoding="utf-8",
                      )
                      gradle = mobile / "android/app/build.gradle.kts"
                      gradle.write_text("defaultConfig { minSdk = flutter.minSdkVersion }", encoding="utf-8")
                      configure_android(mobile)
                      first_result = manifest.read_bytes()
                      configure_android(mobile)
                      self.assertEqual(manifest.read_bytes(), first_result)
                      tree = ET.parse(manifest)
                      names = {node.get(f"{{{ANDROID_NS}}}name") for node in tree.findall("uses-permission")}
                      self.assertEqual(names, {"android.permission.INTERNET", "android.permission.RECORD_AUDIO"})
                      self.assertIsNotNone(tree.find("application/activity"))
                      self.assertIn("maxOf(23, flutter.minSdkVersion)", gradle.read_text(encoding="utf-8"))
          
          
          if __name__ == "__main__":
              unittest.main()
          PY_TESTS
      - name: Test Android setup helper
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          python3 "$CM_BUILD_DIR/.ci-android/test_prepare_android.py" -v
      - name: Check public app configuration
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          python3 "$CM_BUILD_DIR/.ci-android/prepare_android.py" --check-config
      - name: Prepare Android platform and permissions
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          python3 "$CM_BUILD_DIR/.ci-android/prepare_android.py"
      - name: Install Flutter dependencies
        script: |
          set -eu
          cd "$CM_BUILD_DIR/mobile"
          flutter pub get
      - name: Analyze application source
        script: |
          set -eu
          cd "$CM_BUILD_DIR/mobile"
          flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - name: Build installable test APK
        script: |
          set -eu
          cd "$CM_BUILD_DIR/mobile"
          flutter build apk --debug \
            --dart-define="API_BASE_URL=${API_BASE_URL%/}" \
            --dart-define="SUPABASE_URL=${SUPABASE_URL%/}" \
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
    artifacts:
      - mobile/build/app/outputs/flutter-apk/app-debug.apk
