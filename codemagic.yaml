workflows:
  android-test:
    name: Android test APK
    working_directory: .
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: stable
      java: 17
      groups:
        - mobile_config
    scripts:
      - name: Check repository files
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          for required in scripts/prepare_android.py scripts/test_prepare_android.py mobile/pubspec.yaml mobile/lib/main.dart; do
            if [ ! -f "$required" ]; then
              echo "Missing required repository file: $required"
              echo "Upload the scripts/ and mobile/ folders beside codemagic.yaml in the GitHub branch being built."
              exit 1
            fi
          done
      - name: Test Android setup helper
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          python3 "$CM_BUILD_DIR/scripts/test_prepare_android.py" -v
      - name: Check public app configuration
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          python3 "$CM_BUILD_DIR/scripts/prepare_android.py" --check-config
      - name: Prepare Android platform and permissions
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          python3 "$CM_BUILD_DIR/scripts/prepare_android.py"
      - name: Install Flutter dependencies
        script: |
          set -eu
          cd "$CM_BUILD_DIR/mobile"
          flutter pub get
      - name: Analyze application source
        script: |
          set -eu
          cd "$CM_BUILD_DIR/mobile"
          flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - name: Build installable test APK
        script: |
          set -eu
          cd "$CM_BUILD_DIR/mobile"
          flutter build apk --debug \
            --dart-define="API_BASE_URL=${API_BASE_URL%/}" \
            --dart-define="SUPABASE_URL=${SUPABASE_URL%/}" \
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
    artifacts:
      - mobile/build/app/outputs/flutter-apk/app-debug.apk
